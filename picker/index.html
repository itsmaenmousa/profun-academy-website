<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<meta name="robots" content="noindex, nofollow" />
<title>ProFun | Choose your experience</title>
<meta name="description" content="ProFun, the world's trusted partner in attraction operations, and ProFun Academy, its training arm." />
<link rel="icon" href="./profun-symbol-color.svg" />
<link rel="preload" href="./fonts/LufgaLight.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./fonts/LufgaMedium.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: 'Lufga'; src: url('./fonts/LufgaLight.woff2') format('woff2'); font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Lufga'; src: url('./fonts/LufgaRegular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Lufga'; src: url('./fonts/LufgaMedium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Lufga'; src: url('./fonts/LufgaSemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  /* Split screen: two equal halves, the one you point at opens up */
  :root { color-scheme: light only; --ink: #111110; --navy: #000050; --orange: #F85707; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Lufga', system-ui, sans-serif; background: var(--ink); color: #fff; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .strip { position: fixed; top: 0; left: 0; right: 0; height: 4px; display: flex; z-index: 5; }
  .strip i { flex: 1; }

  .split { position: fixed; inset: 0; display: flex; }
  .side {
    position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; align-items: flex-end;
    color: #fff; text-decoration: none; outline: none; isolation: isolate;
    transition: flex-grow .9s cubic-bezier(.16,1,.3,1);
  }
  .split:hover .side { flex-grow: .8; }
  .split .side:hover, .split .side:focus-visible { flex-grow: 1.25; }
  .side + .side { border-left: 1px solid rgba(255,255,255,.12); }
  .bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; transform: scale(1.04); transition: transform 1.6s cubic-bezier(.16,1,.3,1), filter .9s; filter: brightness(.62) saturate(.9); }
  .side:hover .bg, .side:focus-visible .bg { transform: scale(1.1); filter: brightness(.78) saturate(1.05); }
  .side::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(10,10,12,.92) 0%, rgba(10,10,12,.35) 48%, rgba(10,10,12,.15) 100%); }

  .content { width: 100%; padding: 0 clamp(24px, 4.5vw, 72px) clamp(36px, 8vh, 88px); }
  .logo { display: block; width: auto; margin-bottom: clamp(18px, 2.6vh, 28px); }
  .profun .logo { height: clamp(36px, 3.4vw, 50px); }
  .academy .logo { height: clamp(56px, 5.2vw, 80px); }
  .line { font-weight: 300; font-size: clamp(17px, 1.45vw, 22px); line-height: 1.5; color: rgba(255,255,255,.88); max-width: 460px; margin-bottom: clamp(24px, 3.6vh, 36px); }

  /* Shared button: label + round arrow that fills on hover */
  .go { display: inline-flex; align-items: center; gap: 16px; font-size: 16px; font-weight: 500; letter-spacing: .01em; }
  .go .dot { width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.55); transition: background .4s, border-color .4s, transform .5s cubic-bezier(.16,1,.3,1); }
  .side:hover .go .dot, .side:focus-visible .go .dot { background: #fff; border-color: #fff; color: var(--navy); transform: translateX(6px); }
  .academy .go .dot { background: var(--orange); border-color: var(--orange); }
  .academy:hover .go .dot, .academy:focus-visible .go .dot { background: #fff; border-color: #fff; color: var(--orange); }
  .side:focus-visible { box-shadow: inset 0 0 0 3px var(--orange); }

  .top { position: fixed; top: 4px; left: 0; right: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; padding: 24px clamp(24px, 4.5vw, 72px); pointer-events: none; }
  .top img { height: 30px; width: auto; }
  .top p { font-size: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  footer { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,.4); font-weight: 300; z-index: 4; pointer-events: none; }

  /* Entrance */
  .content > * { opacity: 0; transform: translateY(16px); animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
  .profun .content > *:nth-child(1) { animation-delay: .15s } .profun .content > *:nth-child(2) { animation-delay: .25s } .profun .content > *:nth-child(3) { animation-delay: .35s }
  .academy .content > *:nth-child(1) { animation-delay: .3s } .academy .content > *:nth-child(2) { animation-delay: .4s } .academy .content > *:nth-child(3) { animation-delay: .5s }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .content > * { animation: none; opacity: 1; transform: none; } .side, .bg { transition: none; } }

  /* Phones and narrow tablets: stack the halves */
  @media (max-width: 820px) {
    body { overflow: auto; }
    .split { position: static; flex-direction: column; min-height: 100svh; }
    .side { flex: 1 1 50svh; min-height: 50svh; }
    .split:hover .side, .split .side:hover { flex-grow: 1; }
    .side + .side { border-left: 0; border-top: 1px solid rgba(255,255,255,.12); }
    .top { position: absolute; }
    .top p { display: none; }
    .content { padding-bottom: 32px; }
    .academy .content { padding-bottom: 44px; }
    footer { position: static; padding: 16px; background: var(--ink); }
    .go .dot { width: 46px; height: 46px; }
  }
</style>
</head>
<body>
  <div class="strip" aria-hidden="true"><i style="background:#3985FD"></i><i style="background:#15D2A4"></i><i style="background:#99CA32"></i><i style="background:#FFCA03"></i><i style="background:#FC026F"></i><i style="background:#8238EB"></i><i style="background:#F85707"></i></div>
  <div class="top"><img src="./profun-symbol-color.svg" alt="ProFun" /><p>Choose your destination</p></div>

  <main class="split">
    <a class="side profun" href="./profun/index.html#/" aria-label="Enter ProFun">
      <span class="bg" data-bg="profun"></span>
      <span class="content">
        <img class="logo" src="./profun-logo-white.svg" alt="ProFun" />
        <p class="line">The world&rsquo;s trusted partner in attraction operations, from planning to management.</p>
        <span class="go">Enter ProFun <span class="dot"><svg width="16" height="12" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M8.5 1L13 5M13 5L8.5 9M13 5H1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
      </span>
    </a>
    <a class="side academy" href="./academy/index.html#/" aria-label="Enter ProFun Academy">
      <span class="bg" data-bg="academy"></span>
      <span class="content">
        <img class="logo" src="./profun-academy-white.svg" alt="ProFun Academy" />
        <p class="line">Training the people behind the world&rsquo;s greatest experiences.</p>
        <span class="go">Enter ProFun Academy <span class="dot"><svg width="16" height="12" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M8.5 1L13 5M13 5L8.5 9M13 5H1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
      </span>
    </a>
  </main>
  <footer>&copy; <span id="y">2026</span> ProFun Management Group Inc. All rights reserved.</footer>
<script>
  // Lighter images on phones
  var small = window.matchMedia('(max-width: 900px)').matches;
  document.querySelector('[data-bg="profun"]').style.backgroundImage = 'url(./profun-bg' + (small ? '-720' : '') + '.jpg)';
  document.querySelector('[data-bg="academy"]').style.backgroundImage = 'url(./academy-bg' + (small ? '-720' : '') + '.jpg)';
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
